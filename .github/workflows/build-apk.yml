name: Build and Audit ROTG02 Viewer APK

on:
  push:
    branches: [ main, harden-v1.0.1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform + native toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-disabled: true

      - name: Clean workspace and build release from scratch
        run: |
          rm -rf app/build .gradle
          gradle --no-daemon --stacktrace --no-build-cache --rerun-tasks :app:assembleRelease

      - name: Audit APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          test -f "$APK"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          "$AAPT2" dump badging "$APK" | tee apk-badging.txt
          "$AAPT2" dump permissions "$APK" | tee apk-permissions.txt
          unzip -l "$APK" | tee apk-contents.txt

          grep -q "package: name='de.feineflammen.rotg02viewer' versionCode='2' versionName='1.0.1'" apk-badging.txt
          grep -q "android.permission.CAMERA" apk-permissions.txt

          FORBIDDEN_PERMISSIONS='android.permission.(INTERNET|RECORD_AUDIO|READ_CONTACTS|WRITE_CONTACTS|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|REQUEST_INSTALL_PACKAGES|QUERY_ALL_PACKAGES|READ_SMS|SEND_SMS|RECEIVE_SMS|READ_PHONE_STATE|SYSTEM_ALERT_WINDOW|WRITE_EXTERNAL_STORAGE|READ_EXTERNAL_STORAGE)'
          if grep -Eq "$FORBIDDEN_PERMISSIONS" apk-permissions.txt; then
            echo "Forbidden permission found"
            exit 1
          fi

          rm -f librotg02native.so
          unzip -p "$APK" lib/arm64-v8a/librotg02native.so > librotg02native.so
          test -s librotg02native.so

          readelf -d librotg02native.so | tee native-dependencies.txt
          readelf -Ws librotg02native.so             | awk '$7 == "UND" { print $8 }'             | sed 's/@.*//'             | sort -u             | tee native-imports.txt

          if grep -Eiq 'Shared library: \[(libcurl|libssl|libcrypto)[^]]*\]' native-dependencies.txt; then
            echo "Forbidden network/crypto dependency found in native library"
            exit 1
          fi

          FORBIDDEN_NATIVE='^(socket|connect|send|sendto|recv|recvfrom|execve|execl|execlp|execvp|system|popen|fork|ptrace)$'
          if grep -Eq "$FORBIDDEN_NATIVE" native-imports.txt; then
            echo "Forbidden network/process symbol imported by native library"
            grep -E "$FORBIDDEN_NATIVE" native-imports.txt
            exit 1
          fi

          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "commit=$GITHUB_SHA"
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "version=1.0.1"
            echo "variant=release"
            echo "build_cache=disabled"
          } | tee build-info.txt

      - name: Package audited artifact
        run: |
          cp app/build/outputs/apk/release/app-release.apk ROTG02-Viewer-v1.0.1-release.apk
          sha256sum ROTG02-Viewer-v1.0.1-release.apk | tee ROTG02-Viewer-v1.0.1-release.apk.sha256

      - name: Upload audited APK
        uses: actions/upload-artifact@v4
        with:
          name: ROTG02-Viewer-v1.0.1-release-audited
          path: |
            ROTG02-Viewer-v1.0.1-release.apk
            ROTG02-Viewer-v1.0.1-release.apk.sha256
            build-info.txt
            apk-signature.txt
            apk-badging.txt
            apk-permissions.txt
            apk-contents.txt
            native-dependencies.txt
            native-imports.txt
          if-no-files-found: error
