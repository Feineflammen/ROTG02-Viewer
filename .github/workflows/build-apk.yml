name: Build ROTG02 Viewer APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform + native toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Package artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ROTG02-Viewer-v1.0.0-debug.apk
          sha256sum ROTG02-Viewer-v1.0.0-debug.apk > ROTG02-Viewer-v1.0.0-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ROTG02-Viewer-v1.0.0-debug
          path: |
            ROTG02-Viewer-v1.0.0-debug.apk
            ROTG02-Viewer-v1.0.0-debug.apk.sha256
          if-no-files-found: error
